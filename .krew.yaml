apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: dra
spec:
  version: {{ .TagName }}
  homepage: https://github.com/kphatak/kubectl-dra
  shortDescription: Explain and inspect Dynamic Resource Allocation
  description: |
    Read-only inspection and debugging for Kubernetes Dynamic Resource
    Allocation (DRA, resource.k8s.io/v1).

    - why: explains why a ResourceClaim or pod is not allocated, stage by
      stage, and confirms the answer with the scheduler's own allocator
    - map: which pod uses which claim and which device, on which node
    - devices: every published device and whether it is free, allocated,
      tainted or unusable
    - pools: whether each driver's pools are complete enough to use
    - nodes: DRA devices per node, and nodes whose driver is not publishing
  caveats: |
    Needs a cluster that serves resource.k8s.io/v1 (Kubernetes 1.34 or
    newer). The plugin only reads; the RBAC it needs is in
    https://github.com/kphatak/kubectl-dra/blob/main/docs/rbac.md
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    {{addURIAndSha "https://github.com/kphatak/kubectl-dra/releases/download/{{ .TagName }}/kubectl-dra_{{ .TagName }}_darwin_amd64.tar.gz" .TagName }}
    files:
    - from: kubectl-dra
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-dra
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    {{addURIAndSha "https://github.com/kphatak/kubectl-dra/releases/download/{{ .TagName }}/kubectl-dra_{{ .TagName }}_darwin_arm64.tar.gz" .TagName }}
    files:
    - from: kubectl-dra
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-dra
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    {{addURIAndSha "https://github.com/kphatak/kubectl-dra/releases/download/{{ .TagName }}/kubectl-dra_{{ .TagName }}_linux_amd64.tar.gz" .TagName }}
    files:
    - from: kubectl-dra
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-dra
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    {{addURIAndSha "https://github.com/kphatak/kubectl-dra/releases/download/{{ .TagName }}/kubectl-dra_{{ .TagName }}_linux_arm64.tar.gz" .TagName }}
    files:
    - from: kubectl-dra
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-dra
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    {{addURIAndSha "https://github.com/kphatak/kubectl-dra/releases/download/{{ .TagName }}/kubectl-dra_{{ .TagName }}_windows_amd64.tar.gz" .TagName }}
    files:
    - from: kubectl-dra.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-dra.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    {{addURIAndSha "https://github.com/kphatak/kubectl-dra/releases/download/{{ .TagName }}/kubectl-dra_{{ .TagName }}_windows_arm64.tar.gz" .TagName }}
    files:
    - from: kubectl-dra.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-dra.exe
